<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Para ti ❤️</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #000;
    color: white;
    font-family: Arial, sans-serif;
    min-height: 100vh;
    overflow: hidden;
}

/* FONDO DE CORAZONES */
#hearts {
    position: fixed;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
    z-index: 0;
}

.heart {
    position: absolute;
    top: -50px;
    font-size: 20px;
    animation: caer linear infinite;
    filter: drop-shadow(0 0 7px currentColor);
}

@keyframes caer {
    0% {
        transform: translateY(-50px) rotate(0deg);
        opacity: 0;
    }

    10% {
        opacity: 1;
    }

    90% {
        opacity: 1;
    }

    100% {
        transform: translateY(110vh) rotate(360deg);
        opacity: 0;
    }
}

/* PÁGINAS */
.page {
    position: relative;
    z-index: 1;

    width: 100%;
    min-height: 100vh;

    display: none;
    align-items: center;
    justify-content: center;

    padding: 20px;
}

.page.active {
    display: flex;
}

/* TARJETA */
.card {
    width: 100%;
    max-width: 500px;

    background: rgba(0, 0, 0, 0.88);

    border: 1px solid #ff3b72;
    border-radius: 18px;

    padding: 40px 30px;

    text-align: center;

    box-shadow: 0 0 30px rgba(255, 59, 114, 0.18);

    animation: aparecer 0.6s ease;
}

@keyframes aparecer {
    from {
        opacity: 0;
        transform: translateY(20px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* CORAZÓN */
.main-heart {
    font-size: 50px;
    color: #ff3b72;

    margin-bottom: 20px;

    animation: latir 1.5s infinite;
}

@keyframes latir {
    0%, 100% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.2);
    }
}

/* TÍTULO */
h1 {
    font-size: 26px;
    margin-bottom: 15px;
}

/* TEXTO */
.subtitle {
    color: #aaa;
    font-size: 14px;
    margin-bottom: 25px;
}

/* INPUT */
input {
    width: 100%;

    padding: 15px;

    background: transparent;

    border: 1px solid #54202e;
    border-radius: 10px;

    color: white;

    font-size: 16px;
    text-align: center;

    outline: none;

    margin-bottom: 12px;
}

input::placeholder {
    color: #777;
}

input:focus {
    border-color: #ff3b72;

    box-shadow:
        0 0 15px rgba(255, 59, 114, 0.2);
}

/* ERROR */
#error {
    color: #ff526f;
    font-size: 13px;

    height: 20px;

    opacity: 0;
}

#error.show {
    opacity: 1;
}

/* BOTÓN */
button {
    margin-top: 10px;

    padding: 13px 30px;

    background: transparent;

    border: 1px solid #ff3b72;
    border-radius: 10px;

    color: #ff3b72;

    font-size: 15px;

    cursor: pointer;

    transition: 0.25s;
}

button:hover {
    background: rgba(255, 59, 114, 0.12);

    box-shadow:
        0 0 20px rgba(255, 59, 114, 0.3);
}

/* MENSAJE */
.message {
    font-size: 19px;
    line-height: 1.8;
    color: #f0e8e8;
}

/* CELULAR */
@media (max-width: 500px) {

    .card {
        padding: 35px 22px;
    }

    h1 {
        font-size: 23px;
    }

    .message {
        font-size: 17px;
        line-height: 1.8;
    }
}
</style>
</head>

<body>

<!-- CORAZONES -->
<div id="hearts"></div>


<!-- PRIMERA PÁGINA -->
<section class="page active" id="page1">

    <div class="card">

        <div class="main-heart">❤</div>

        <h1>¿Cómo te llamas?</h1>

        <p class="subtitle">
            Pon tu nombre aquí para continuar
        </p>

        <input
            type="text"
            id="name"
            placeholder="Pon tu nombre aquí..."
            autocomplete="off"
        >

        <div id="error">
            Este mensaje no es para ti.
        </div>

        <button onclick="entrar()">
            Continuar ❤️
        </button>

    </div>

</section>


<!-- SEGUNDA PÁGINA -->
<section class="page" id="page2">

    <div class="card">

        <div class="main-heart">❤</div>

        <div class="message">
            perdón por no ser el chico que tú esperabas
            la vdd si te amo pero si no quieres nda conmigo
            no te insistiré mas 🥲
        </div>

    </div>

</section>


<script>

/* NOMBRE QUE PUEDE ENTRAR */
const nombreCorrecto = "fernanda";


/* CAMBIAR DE PÁGINA */
function entrar() {

    const input = document.getElementById("name");
    const error = document.getElementById("error");

    const nombre = input.value.trim().toLowerCase();

    if (nombre === nombreCorrecto) {

        error.classList.remove("show");

        document.getElementById("page1")
            .classList.remove("active");

        document.getElementById("page2")
            .classList.add("active");

    } else {

        error.classList.add("show");

        input.value = "";

        input.focus();
    }
}


/* ENTER TAMBIÉN SIRVE PARA CONTINUAR */
document.getElementById("name").addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Enter") {
            entrar();
        }

    }
);


/* CORAZONES DE MUCHOS COLORES */
const colores = [
    "#ff1744",
    "#ff4081",
    "#e040fb",
    "#7c4dff",
    "#2979ff",
    "#00e5ff",
    "#00e676",
    "#76ff03",
    "#ffea00",
    "#ffc400",
    "#ff9100",
    "#ff3d00"
];

const simbolos = ["❤", "♥", "♡"];


/* CREAR CORAZONES */
for (let i = 0; i < 60; i++) {

    const heart = document.createElement("div");

    heart.className = "heart";

    heart.textContent =
        simbolos[Math.floor(
            Math.random() * simbolos.length
        )];

    heart.style.left =
        Math.random() * 100 + "%";

    heart.style.color =
        colores[Math.floor(
            Math.random() * colores.length
        )];

    heart.style.fontSize =
        (12 + Math.random() * 25) + "px";

    heart.style.animationDuration =
        (5 + Math.random() * 8) + "s";

    heart.style.animationDelay =
        (-Math.random() * 12) + "s";

    document.getElementById("hearts")
        .appendChild(heart);
}

</script>

</body>
</html>
